services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: "8000"
      MAINTSENSE_CORS_ORIGINS: ""
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
